<title>Module A1 — Atelier chiffré · Cycl'Oise</title>
<style>
:root{--nav:#14503f;--nav2:#1c6a53;--navdark:#0b3529;--navlite:#bcdcd0;--line:#c2ded3;--bg:#f2f8f5;
--card:#fff;--accbg:#e7f4ef;--zebra:#f6fbf9;--txt:#1a1a1a;--muted:#586b63}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
 background:var(--bg);color:var(--txt);font-size:16px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
header{flex:0 0 auto;background:var(--nav);color:#fff;padding:8px 14px;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:20}
.htop{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:.97rem;margin:0;font-weight:700}
.hsub{font-size:.73rem;color:var(--navlite);margin-top:1px}
#clock{font-size:1.1rem;font-weight:800;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.14);
 padding:4px 10px;border-radius:9px;cursor:pointer;white-space:nowrap;color:#fff}
#clock.hot{background:#8a2f2f}
.bar{height:5px;background:var(--navdark);border-radius:99px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:#7ed0ae;width:0;transition:width .3s}
nav{flex:0 0 auto;display:flex;gap:5px;overflow-x:auto;padding:7px 10px;background:var(--nav2);scrollbar-width:none;z-index:19}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;min-height:38px;padding:7px 12px;border:0;border-radius:20px;
 background:rgba(255,255,255,.14);color:#eaf5f0;font-size:.8rem;font-weight:600;cursor:pointer}
nav button.on{background:#fff;color:var(--nav)}
nav button.fait{background:#7ed0ae;color:var(--navdark)}
.app{flex:1 1 auto;display:grid;grid-template-columns:minmax(300px,40%) 1fr;min-height:0}
#annexes{overflow-y:auto;background:#fff;border-right:1px solid var(--line);padding:12px 13px 40px;-webkit-overflow-scrolling:touch}
#work{overflow-y:auto;padding:16px 16px 40px;-webkit-overflow-scrolling:touch}
#annexes h2{font-size:.9rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 0 10px}
.acc{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;overflow:hidden}
.acc>button{width:100%;text-align:left;background:var(--accbg);border:0;padding:10px 12px;font:inherit;
 font-size:.85rem;font-weight:700;color:var(--nav);cursor:pointer;display:flex;justify-content:space-between;gap:8px;min-height:42px;align-items:center}
.acc>div{display:none;padding:10px 12px;border-top:1px solid var(--line)}
.acc.open>div{display:block}
.acc>button i{font-style:normal;color:var(--muted);font-weight:400}
section{display:none}section.on{display:block}
h2{font-size:1.1rem;color:var(--nav);margin:2px 0 4px}
h3{font-size:.95rem;color:var(--nav);margin:18px 0 6px}
p{margin:0 0 9px}
.lede{color:var(--muted);font-size:.87rem}
.budget{display:inline-block;background:var(--accbg);border:1px solid var(--line);color:var(--nav);
 border-radius:20px;padding:3px 11px;font-size:.76rem;font-weight:700;margin-bottom:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin:0 0 13px}
table{border-collapse:collapse;width:100%;font-size:.8rem;margin:7px 0}
th{background:var(--nav);color:#fff;text-align:left;padding:6px 7px;font-weight:600}
td{border:1px solid var(--line);padding:5px 7px;vertical-align:middle}
tr:nth-child(even) td{background:var(--zebra)}
td.n{text-align:right;white-space:nowrap}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
blockquote{margin:0 0 7px;padding:5px 0 5px 11px;border-left:3px solid var(--line);font-style:italic;color:#333;font-size:.86rem}
.q{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);
 border-radius:10px;padding:12px 13px;margin:0 0 11px}
.q.rep{border-left-color:var(--nav)}
.q.good{border-left-color:#5fb894}
.q.bad{border-left-color:#c98a8a}
.qh{display:flex;gap:8px;align-items:baseline;margin-bottom:8px}
.qn{font-weight:800;color:var(--nav);font-size:.84rem;flex:0 0 auto}
.qt{font-size:.91rem}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text],textarea{font:inherit;font-size:.97rem;padding:10px 11px;border:1.5px solid var(--line);
 border-radius:9px;background:#fff;width:100%;max-width:220px}
textarea{max-width:100%;min-height:92px;line-height:1.45;resize:vertical}
input.cell{max-width:125px;padding:7px 8px;font-size:.87rem}
input:focus,textarea:focus{outline:none;border-color:var(--nav)}
input:disabled,textarea:disabled{background:#f4f6f8;color:#333}
select{font:inherit;font-size:.9rem;padding:9px;border:1.5px solid var(--line);border-radius:9px;background:#fff;width:100%}
.unit{color:var(--muted);font-size:.85rem}
.saved{font-size:.76rem;color:var(--nav);font-weight:700;margin-top:7px;display:none}
.saved.on{display:block}
.btn{min-height:42px;padding:9px 16px;border:0;border-radius:9px;background:var(--nav);color:#fff;font-size:.87rem;font-weight:600;cursor:pointer}
.btn:disabled{background:#b9c5cd;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--nav);border:1.5px solid var(--nav)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.79rem}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.opts{display:flex;flex-direction:column;gap:7px;margin-top:3px}
.opt{display:flex;gap:9px;align-items:flex-start;min-height:42px;padding:9px 10px;border:1.5px solid var(--line);
 border-radius:9px;background:#fff;cursor:pointer;font-size:.88rem}
.opt.sel{border-color:var(--nav);background:var(--accbg)}
.opt.good{border-color:#a9d5c6;background:#e7f4ef}
.opt.bad{border-color:#e2b3b3;background:#fbeeee}
.opt span.mk{flex:0 0 auto;font-weight:800;color:var(--nav)}
.fb{margin-top:9px;padding:9px 11px;border-radius:9px;font-size:.85rem}
.fb.ok{background:#e7f4ef;border:1px solid #a9d5c6;color:#14503f}
.fb.ko{background:#fbeeee;border:1px solid #e2b3b3;color:#8a2f2f}
.fb.info{background:#fdf7ec;border:1px solid #e0c08a;color:#5c3f0c}
.note{background:var(--accbg);border-left:4px solid var(--nav);border-radius:0 8px 8px 0;padding:9px 12px;margin:11px 0;font-size:.85rem}
.warn{background:#fdf7ec;border:1px solid #e0c08a;border-radius:9px;padding:9px 12px;margin:11px 0;font-size:.85rem;color:#5c3f0c}
.score{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0}
.sc{flex:1 1 100px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.sc b{display:block;font-size:1.3rem;color:var(--nav);line-height:1.2}
.sc small{color:var(--muted);font-size:.71rem}
.kwbar{height:5px;background:#e4ecf2;border-radius:99px;margin-top:7px;overflow:hidden}
.kwbar i{display:block;height:100%;width:0}
.selfrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
footer{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);
 padding:8px 13px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:9px;
 justify-content:space-between;align-items:center;z-index:21;flex-wrap:wrap}
footer .l{font-size:.79rem;color:var(--muted)}
footer .l b{color:var(--nav)}
#annexbtn{display:none}
@media(max-width:1000px){
 .app{grid-template-columns:1fr}
 #annexes{position:fixed;inset:0;z-index:70;display:none;padding-top:14px;border:0}
 #annexes.show{display:block}
 #annexbtn{display:inline-block}
 #annexclose{display:block}
}
@media(min-width:1001px){#annexclose{display:none}}
@media print{nav,footer,#clock,.acts{display:none}body{overflow:visible;height:auto}
 .app{display:block}section{display:block!important}#annexes{display:block;border:0}}

@media(max-width:600px){
 h1{font-size:.86rem}
 .hsub{font-size:.68rem}
 #clock{font-size:.98rem;padding:3px 8px}
 nav button{padding:6px 10px;font-size:.76rem;min-height:36px}
 #work{padding:12px 11px 30px}
 #annexes{padding:12px 11px 30px}
 .q{padding:11px 11px}
 .qt{font-size:.89rem}
 table{font-size:.76rem}
 th,td{padding:5px 6px}
 input[type=text],textarea,select{font-size:16px;max-width:100%}
 input.cell{max-width:100%}
 .opt{font-size:.86rem;padding:10px 9px}
 footer{flex-direction:column;align-items:stretch;gap:7px}
 footer .l{text-align:center}
 footer>span:last-child{display:flex;gap:7px}
 footer>span:last-child .btn{flex:1 1 auto}
 .sc{flex:1 1 44%}
}

</style>
</head>

<header>
  <div class="htop">
    <div><h1>Module A1 — Atelier chiffré</h1>
      <div class="hsub">Terminale STMG · cas Cycl'Oise · 2 heures</div></div>
    <div id="clock" onclick="clockToggle()">2:00:00</div>

</header>

<nav id="nav"></nav>

</div>

<footer>

  <span style="display:flex;gap:8px;flex-wrap:wrap">

</footer>

/* =========================================================
   MOTEUR — écran partagé, correction différée
   ========================================================= */
const R=(n,d=2)=>Math.round(n*10**d)/10**d;
const fr=(n,d=2)=>R(n,d).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:d});
function norm(s){return (s||"").toString().trim().replace(/\s|\u00a0|€|%/g,"").replace(",",".").replace(/[^0-9.\-+]/g,"");}
const T8=[62456,63580,37780,62184,226000];
const NUM=()=>Object.values(NOT).flatMap(n=>n.q);
const findQ=id=>NUM().find(q=>q.id===id);
let ANS={}, CORR=false, CUR="s-intro";

/* liste complète des items à renseigner */
function ITEMS(){
  const L=[];
  NUM().forEach(q=>L.push("Q"+q.id));
  N8.forEach((q,i)=>L.push("V"+i));
  N9.forEach((q,i)=>L.push("P"+i));
  T8.forEach((g,i)=>L.push("T"+i));
  TB.forEach((r,i)=>L.push("B"+i));
  return L;
}
const rempli=k=>ANS[k]!==undefined&&ANS[k]!==null&&String(ANS[k]).trim()!=="";
const nbRempli=()=>ITEMS().filter(rempli).length;

/* ---------- navigation ---------- */
const ORD=[["s-intro","Départ"],["s-n1","N1"],["s-n2","N2"],["s-n3","N3"],["s-n4","N4"],["s-n5","N5"],
 ["s-n6","N6"],["s-n7","N7"],["s-n8","N8"],["s-n9","N9"],["s-n10","N10"],["s-bilan","Bilan"]];
function buildNav(){document.getElementById('nav').innerHTML=ORD.map(([id,l])=>
 `<button id="n-${id}" onclick="go('${id}')">${l}</button>`).join("");}
function sectItems(id){
  const k=id.replace('s-','');
  if(NOT[k]) return NOT[k].q.map(q=>"Q"+q.id).concat(k==='n10'?TB.map((r,i)=>"B"+i):[]);
  if(id==='s-n8') return N8.map((q,i)=>"V"+i).concat(T8.map((g,i)=>"T"+i));
  if(id==='s-n9') return N9.map((q,i)=>"P"+i);
  return [];
}
function go(id){CUR=id;render();window.scrollTo(0,0);
 const w=document.getElementById('work'); if(w)w.scrollTop=0;
 if(window.innerWidth<=1000)document.getElementById('annexes').classList.remove('show');}
function majNav(){ORD.forEach(([id])=>{const b=document.getElementById('n-'+id);if(!b)return;
 const it=sectItems(id);
 b.className=(id===CUR?'on':(it.length&&it.every(rempli)?'fait':''));});}
function toggleAnnexes(){document.getElementById('annexes').classList.toggle('show');}

/* ---------- annexes ---------- */
function buildAnnexes(){
  document.getElementById('annexlist').innerHTML=Object.keys(DOCS).map(n=>
   `<div class="acc" id="acc-${n}"><button onclick="document.getElementById('acc-${n}').classList.toggle('open')">
    <span>Doc ${n} — ${DOCS[n].t}</span><i>+</i></button><div>${DOCS[n].h}</div></div>`).join("");
  ["1","2"].forEach(n=>{const e=document.getElementById('acc-'+n);if(e)e.classList.add('open');});
}
function ouvrir(n){const e=document.getElementById('acc-'+n);if(!e)return;
 e.classList.add('open');
 if(window.innerWidth<=1000)document.getElementById('annexes').classList.add('show');
 e.scrollIntoView({block:'start'});}
function chips(l){return (!l||!l.length)?"":`<div class="acts" style="margin:0 0 9px">`+
 l.map(n=>`<button class="btn sm ghost" onclick="ouvrir(${n})">Annexe ${n}</button>`).join("")+`</div>`;}

/* ---------- saisie ---------- */
function setA(k,v){ANS[k]=v;majFoot();majNav();}
function numCard(q){
  const k="Q"+q.id, v=ANS[k]===undefined?"":ANS[k];
  let corr="";
  if(CORR){
    const ok=isFinite(parseFloat(norm(v)))&&Math.abs(parseFloat(norm(v))-q.ans)<=q.tol;
    corr=`<div class="fb ${ok?'ok':'ko'}">${ok?"<b>Correct.</b> ":"<b>Attendu : "+fr(q.ans,4)+" "+(q.u||"")+".</b> "}${q.ex}</div>`;
  }
  const cls=CORR?(corrOk(k,q)?"good":"bad"):(rempli(k)?"rep":"");
  return `<div class="q ${cls}"><div class="qh"><span class="qn">${q.id}</span><span class="qt">${q.t}</span></div>
   ${CORR?"":chips(q.docs)}
   <div class="numrow"><input type="text" inputmode="decimal" value="${String(v).replace(/"/g,'&quot;')}"
     ${CORR?"disabled":""} oninput="setA('${k}',this.value);this.closest('.q').classList.add('rep');
     this.parentNode.nextElementSibling.classList.add('on')"><span class="unit">${q.u||""}</span></div>
   <div class="saved ${rempli(k)&&!CORR?'on':''}">Réponse enregistrée</div>
   ${(!CORR&&q.hint)?`<div class="acts"><button class="btn sm ghost" onclick="alert('Indice : '+${JSON.stringify(q.hint)})">Indice</button></div>`:""}
   ${corr}</div>`;
}
function corrOk(k,q){
  if(k[0]==="Q"){const v=parseFloat(norm(ANS[k]));return isFinite(v)&&Math.abs(v-q.ans)<=q.tol;}
  if(k[0]==="V"){return ANS[k]===(N8[+k.slice(1)].ok?"vrai":"faux");}
  if(k[0]==="P"){return ANS[k]===N9[+k.slice(1)].ok;}
  if(k[0]==="T"){const v=parseFloat(norm(ANS[k]));return isFinite(v)&&Math.abs(v-T8[+k.slice(1)])<=5;}
  if(k[0]==="B"){const r=TB[+k.slice(1)],v=parseFloat(norm(ANS[k]));return isFinite(v)&&Math.abs(v-r[1])<=r[2];}
  return false;
}
function choixCard(pref,i,q,labels){
  const k=pref+i, v=ANS[k];
  let corr="";
  if(CORR){const ok=corrOk(k,q);
   const att=(pref==="V")?(q.ok?"vrai":"faux"):q.ok;
   corr=`<div class="fb ${ok?'ok':'ko'}">${ok?"<b>Correct.</b> ":"<b>Attendu : "+att+".</b> "}${q.ex}</div>`;}
  const cls=CORR?(corrOk(k,q)?"good":"bad"):(rempli(k)?"rep":"");
  return `<div class="q ${cls}"><div class="qh"><span class="qn">${String.fromCharCode(97+i)}</span><span class="qt">${q.t}</span></div>
   <div class="acts">`+labels.map(L=>
    `<button class="btn sm ${v===L[1]?'':'ghost'}" ${CORR?"disabled":""} onclick="setA('${k}','${L[1]}');render()">${L[0]}</button>`).join("")+
   `</div><div class="saved ${rempli(k)&&!CORR?'on':''}">Réponse enregistrée : ${v||""}</div>${corr}</div>`;
}
function cellInput(k,val){
 return `<input class="cell" type="text" inputmode="decimal" value="${val===undefined?"":val}" ${CORR?"disabled":""}
  oninput="setA('${k}',this.value)" style="${CORR?(corrOk(k,null)?'border-color:#a9d5c6;background:#e7f4ef':'border-color:#e2b3b3;background:#fbeeee'):''}">`;
}

/* ---------- rendu des sections ---------- */
function render(){
  const w=document.getElementById('work');
  let h="";
  if(CUR==="s-intro") h=vueIntro();
  else if(CUR==="s-bilan") h=vueBilan();
  else if(CUR==="s-n8") h=vueN8();
  else if(CUR==="s-n9") h=vueN9();
  else if(CUR==="s-n10") h=vueN10();
  else {const k=CUR.replace('s-',''),n=NOT[k];
    h=`<h2>${n.t}</h2><span class="budget">${n.min} minutes</span><p class="lede">${n.lede}</p>`+
      n.q.map(numCard).join("");}
  w.innerHTML=h; majNav(); majFoot();
}

 <div class="card"><div class="wrap"><table>
 <tr><th>Activité</th><th>CA 2023</th><th>Part</th><th>CA 2026</th><th>Part</th><th>Variation en €</th></tr>
 <tr><td>Vélos neufs</td><td class="n">460 040</td><td class="n">62,0 %</td><td class="n">522 496</td><td class="n">54,0 %</td><td>${cellInput("T0",ANS["T0"])}</td></tr>
 <tr><td>Occasion reconditionnée</td><td class="n">81 620</td><td class="n">11,0 %</td><td class="n">145 200</td><td class="n">15,0 %</td><td>${cellInput("T1",ANS["T1"])}</td></tr>
 <tr><td>Atelier réparation</td><td class="n">155 820</td><td class="n">21,0 %</td><td class="n">193 600</td><td class="n">20,0 %</td><td>${cellInput("T2",ANS["T2"])}</td></tr>
 <tr><td>Location par abonnement</td><td class="n">44 520</td><td class="n">6,0 %</td><td class="n">106 704</td><td class="n">11,0 %</td><td>${cellInput("T3",ANS["T3"])}</td></tr>
 <tr><td><b>Total</b></td><td class="n"><b>742 000</b></td><td class="n">100 %</td><td class="n"><b>968 000</b></td><td class="n">100 %</td><td>${cellInput("T4",ANS["T4"])}</td></tr>
 </table></div>
 ${CORR?`<div class="fb ${T8.every((g,i)=>corrOk("T"+i))?'ok':'ko'}"><b>Variations attendues :</b> ${T8.map(g=>fr(g,0)+" €").join(" · ")}.
  Trois activités progressent de montants presque identiques (entre 62 000 et 64 000 €) alors que leurs taux vont de + 13,6 % à + 139,7 % : regarder les seuls taux donne une image très différente de la réalité.</div>`:""}
 </div>`+N8.map((q,i)=>choixCard("V",i,q,[["Vrai","vrai"],["Faux","faux"]])).join("");
}
function vueN9(){
 return `<h2>N9 — Contrôle de vraisemblance</h2><span class="budget">10 minutes</span>
 <p class="lede">Six résultats rendus par des élèves sur ce même cas. Lesquels sont impossibles, et pourquoi ?</p>`+
 N9.map((q,i)=>choixCard("P",i,q,[["Plausible","plausible"],["Impossible","impossible"]])).join("");
}
function vueN10(){
 let tab=`<div class="card"><h3 style="margin-top:0">A. Le tableau de bord 2026</h3>
  <div class="wrap"><table><tr><th>Indicateur</th><th style="width:34%">Votre résultat</th><th style="width:16%">Unité</th></tr>`+
  TB.map((r,i)=>`<tr><td>${r[0]}</td><td>${cellInput("B"+i,ANS["B"+i])}</td><td class="unit">${r[3]}</td></tr>`).join("")+
  `</table></div>`;
 if(CORR){tab+=`<div class="fb ${TB.every((r,i)=>corrOk("B"+i))?'ok':'ko'}"><b>Résultats attendus :</b><ul style="margin:6px 0 0">`+
  TB.map(r=>`<li>${r[0]} : ${r[4]} = <b>${fr(r[1],1)} ${r[3]}</b></li>`).join("")+
  `</ul><p style="margin:8px 0 0">Le taux de valeur ajoutée (36,2 %) dépasse à peine la moyenne de la filière (34 %) : l'entreprise revend beaucoup plus qu'elle ne transforme. Mais un taux de marge nette de 5,9 % et une rentabilité financière de 21,3 % traduisent une activité saine.</p></div>`;}
 tab+=`</div>`;
 return `<h2>N10 — Tableau de bord et décision</h2><span class="budget">18 minutes</span>
  <p class="lede">Deux temps : construire le tableau de bord, puis trancher sur l'abonnement.</p>
  ${CORR?"":chips([3,5])}${tab}
  <h3>B. Faut-il renforcer l'abonnement ?</h3>`+NOT.n10.q.map(numCard).join("")+
  `<div class="note"><b>Pour finir.</b> Rédigez trois phrases d'interprétation, une par indicateur de votre choix, en respectant les trois temps : constat chiffré, comparaison, interprétation. Le taux de valeur ajoutée moyen du commerce de cycles est de 34 %.</div>`;
}
function grpScore(g){
 const k=ITEMS().filter(x=>grpOf(x)===g);
 return k.filter(x=>corrOk(x,x[0]==="Q"?findQ(x.slice(1)):null)).length+"/"+k.length;
}
function grpOf(k){
 if(k[0]==="Q")return "n"+k.slice(1).split('.')[0];
 if(k[0]==="V"||k[0]==="T")return "n8";
 if(k[0]==="P")return "n9";
 if(k[0]==="B")return "n10";
 return "?";
}
function vueBilan(){
 if(!CORR) return `<h2>Bilan</h2><div class="card">
  <p>Le bilan s'affiche une fois le dossier terminé et corrigé.</p>
  <p class="lede">Il reste <b>${ITEMS().length-nbRempli()}</b> réponse(s) à saisir. Le bouton « Terminer et corriger », en bas de l'écran, s'active dès que tout est rempli.</p></div>`;
 const L=[["n1","Parts"],["n2","Taux"],["n3","Variations"],["n4","Taux moyen"],["n5","Points"],
  ["n6","Conversions"],["n7","HT/TTC"],["n8","Lecture"],["n9","Vraisemblance"],["n10","Décision"]];
 const tot=ITEMS().filter(x=>corrOk(x,x[0]==="Q"?findQ(x.slice(1)):null)).length;
 const bad={};
 ITEMS().forEach(x=>{if(!corrOk(x,x[0]==="Q"?findQ(x.slice(1)):null)){const g=grpOf(x);bad[g]=(bad[g]||0)+1;}});
 const lab={n1:"proportions et parts",n2:"application et enchaînement des taux",n3:"variations, coefficient, indice",
  n4:"taux annuel moyen et projection",n5:"points et pourcentage",n6:"proportionnalité et conversions",
  n7:"HT, TTC et marges",n8:"lecture de tableau",n9:"contrôle de vraisemblance",n10:"tableau de bord et décision"};
 let h=`<h2>Bilan</h2><div class="card">
  <div class="score">`+L.map(([g,l])=>`<div class="sc"><b>${grpScore(g)}</b><small>${l}</small></div>`).join("")+
  `<div class="sc"><b>${tot}/${ITEMS().length}</b><small>Total</small></div></div>`;
 h += Object.keys(bad).length
  ? `<div class="note"><b>À retravailler en priorité :</b><ul style="margin:6px 0 0">`+
    Object.entries(bad).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<li>${lab[k]} — ${v} erreur${v>1?"s":""}</li>`).join("")+`</ul></div>`
  : `<div class="note"><b>Aucune erreur.</b> Reprenez N4 et N7 sans le mémo : ce sont les notions qui se perdent le plus vite.</div>`;
 h+=`<p class="lede">Temps restant sur les deux heures : <b>${fmt(Math.max(0,left))}</b>.</p>
  <div class="acts"><button class="btn" onclick="exporter()">Télécharger mon travail</button>
  <button class="btn ghost" onclick="window.print()">Imprimer</button></div></div>`;
 return h;
}

/* ---------- pied de page et déverrouillage ---------- */
function majFoot(){
 const n=nbRempli(),T=ITEMS().length;
 document.getElementById('pbar').style.width=(100*n/T)+"%";
 document.getElementById('foot').innerHTML=CORR
  ? `Dossier corrigé — <b>${ITEMS().filter(x=>corrOk(x,x[0]==="Q"?findQ(x.slice(1)):null)).length} / ${T}</b>`
  : `<b>${n} / ${T}</b> réponses enregistrées${n<T?` — il en reste ${T-n}`:` — vous pouvez corriger`}`;
 const b=document.getElementById('endbtn');
 b.disabled=CORR||n<T; b.textContent=CORR?"Corrigé affiché":"Terminer et corriger";
}
function reveal(force){
 if(!force&&nbRempli()<ITEMS().length)return;
 if(!force&&!confirm("Afficher la correction ? Vos réponses seront verrouillées et vous ne pourrez plus les modifier."))return;
 CORR=true; clearInterval(tick); running=false; go('s-bilan');
}
function teacher(){
 const c=prompt("Code enseignant :");
 if(c===null)return;
 if(c.trim().toUpperCase()==="GREMPRIME"){CORR=true;render();alert("Correction déverrouillée.");}
 else alert("Code incorrect.");
}
function exporter(){
 let L=["MODULE A1 — ATELIER CHIFFRE — CAS CYCL'OISE","Genere le "+new Date().toLocaleString('fr-FR'),
  "Temps restant : "+fmt(Math.max(0,left)),"",
  "Score : "+ITEMS().filter(x=>corrOk(x,x[0]==="Q"?findQ(x.slice(1)):null)).length+" / "+ITEMS().length,
  "".padEnd(64,"-"),""];
 NUM().forEach(q=>{const k="Q"+q.id;
  L.push(q.id+" — "+q.t.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim());
  L.push("   reponse : "+(ANS[k]||"(vide)")+"   attendu : "+q.ans+" "+(q.u||"")+
   "   -> "+(corrOk(k,q)?"correct":"a revoir"));});
 N8.forEach((q,i)=>L.push("N8-"+String.fromCharCode(97+i)+" : "+(ANS["V"+i]||"(vide)")+" -> "+(corrOk("V"+i,q)?"correct":"a revoir")));
 N9.forEach((q,i)=>L.push("N9-"+String.fromCharCode(97+i)+" : "+(ANS["P"+i]||"(vide)")+" -> "+(corrOk("P"+i,q)?"correct":"a revoir")));
 T8.forEach((g,i)=>L.push("Tableau N8 cellule "+(i+1)+" : "+(ANS["T"+i]||"(vide)")+"   attendu "+g));
 TB.forEach((r,i)=>L.push("Tableau de bord — "+r[0]+" : "+(ANS["B"+i]||"(vide)")+"   attendu "+r[1]+" "+r[3]));
 const b=new Blob([L.join("\n")],{type:"text/plain;charset=utf-8"});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);
 a.download="ModuleA1_CyclOise_travail.txt";a.click();URL.revokeObjectURL(a.href);
}

/* ---------- chronomètre ---------- */
let left=7200,tick=null,running=false;
function fmt(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
 return h+":"+String(m).padStart(2,'0')+":"+String(x).padStart(2,'0');}
function clockStart(){if(running)return;running=true;
 tick=setInterval(()=>{left--;const c=document.getElementById('clock');
  c.textContent=fmt(Math.max(0,left));if(left<=600)c.className="hot";
  if(left<=0){clearInterval(tick);running=false;c.textContent="0:00:00";}},1000);}
function clockToggle(){if(running){clearInterval(tick);running=false;
 document.getElementById('clock').textContent=fmt(left)+" \u23f8";}
 else{document.getElementById('clock').textContent=fmt(left);clockStart();}}

buildNav(); buildAnnexes(); render();
</script>
